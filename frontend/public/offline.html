<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />
    <title>Golden Land Restaurant | Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(255, 247, 237, 0.72), #f8fafc 45%);
      }

      main {
        width: min(420px, calc(100% - 32px));
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
      }

      p:first-of-type {
        margin: 22px 0 8px;
        color: #f97316;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.15;
      }

      p:last-of-type {
        margin: 14px 0 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.7;
      }

      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: #f97316;
        color: #fff;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/image/logo.png" alt="Golden Land Restaurant" />
      <p>Offline</p>
      <h1>Connection unavailable</h1>
      <p>Some saved app screens can still open. Reconnect to load live orders, checkout, vouchers, and notifications.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
